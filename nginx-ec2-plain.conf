events {}
http {
    upstream smartprop_app { server smartprop-app:3000; keepalive 32; }
    upstream waha_api { server waha:3030; keepalive 16; }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://smartprop_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        location /api/ {
            proxy_pass http://smartprop_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /waha/ {
            proxy_pass http://waha_api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
        }

        location /health {
            access_log off;
            proxy_pass http://smartprop_app/api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
