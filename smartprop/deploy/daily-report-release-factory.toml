version = 2

[project]
id = "propertydemo"
root = "../.."

[contracts]
verify = ["smartprop/scripts/daily-report-verify.py"]
existing_host = ["smartprop/deploy/daily_report_release.py", "release"]
new_vps_stage = []
new_vps_activate = []

[policy]
consumers = ["daily_report", "main_app", "scraper_worker"]
rejected_patterns = ["**/.env*", "**/*.pem", "**/credentials/**", "smartprop/migrations/**"]

[[executors]]
version = 1
mode = "existing-host"
contracts = ["existing_host"]
plan_schema_versions = [1]
plan_fields = ["source_identity", "artifact_bindings", "deployment.affected_consumers", "deployment.artifacts", "deployment.preserved_consumers", "deployment.required_smoke", "deployment.policy_sha256"]
plan_contract = "existing_host"
artifact_contract = "existing_host"
preservation_contract = "existing_host"
cutover_contract = "existing_host"
rollback_contract = "existing_host"
smoke_contract = "existing_host"

[[rules]]
id = "daily_report"
patterns = ["smartprop/scripts/smartprop-daily-report.ts", "smartprop/scripts/daily-report-send.test.ts", "smartprop/scripts/build-daily-report.test.ts", "smartprop/scripts/daily-report-verify.py", "smartprop/deploy/build-daily-report.ts", "smartprop/deploy/daily_report_*.py", "smartprop/deploy/test_daily_report_*.py", "smartprop/deploy/daily-report-release-factory.toml"]
component_inputs = ["smartprop/scripts/smartprop-daily-report.ts", "smartprop/deploy/build-daily-report.ts", "smartprop/deploy/daily_report_*.py", "smartprop/deploy/daily-report-release-factory.toml", "smartprop/package.json", "smartprop/bun.lock"]
artifacts = ["daily_report_component"]
consumers = ["daily_report"]
smoke = [["smartprop/scripts/daily-report-verify.py"]]

[[rules]]
id = "main_app"
patterns = ["smartprop/src/**"]
component_inputs = ["smartprop/src/**"]
artifacts = []
consumers = ["main_app"]
smoke = []

[[rules]]
id = "scraper_worker"
patterns = ["smartprop/scripts/scraper-worker.ts"]
component_inputs = ["smartprop/scripts/scraper-worker.ts"]
artifacts = []
consumers = ["scraper_worker"]
smoke = []
