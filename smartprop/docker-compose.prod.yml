# Production Docker Compose Configuration for SmartProp
# Includes all services: app, database, WhatsApp, and reverse proxy

version: '3.8'

services:
  # Main Application
  smartprop-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: smartprop-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE=${SUPABASE_SERVICE_ROLE}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - WAHA_URL=http://waha:3030
      - GROQ_API_KEY=${GROQ_API_KEY}
      - WABA_TOKEN=${WABA_TOKEN}
      - WABA_PHONE_ID=${WABA_PHONE_ID}
    ports:
      - "3000:3000"
    volumes:
      - app-storage:/app/storage
      - app-logs:/app/logs
    networks:
      - smartprop-network
    depends_on:
      - waha
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # WhatsApp Business API (WAHA)
  waha:
    image: devlikeapro/waha:arm-2025.9.8
    container_name: smartprop-waha
    restart: unless-stopped
    environment:
      - WAHA_DASHBOARD_ENABLED=true
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD:-admin}
      - WAHA_WEBHOOK_URL=${PUBLIC_BASE_URL}/api/whatsapp/webhook
      - WAHA_WEBHOOK_EVENTS=message,message.any,state.change,group.join,presence.update
      - WAHA_SESSION_STORE_ENABLED=true
      - WAHA_SESSION_STORE_PATH=/app/sessions
      - WAHA_FILES_STORE_ENABLED=true
      - WAHA_FILES_STORE_PATH=/app/files
      - WAHA_LOG_LEVEL=info
      - WAHA_PRINT_QR=true
    ports:
      - "3030:3030"
    volumes:
      - waha-sessions:/app/sessions
      - waha-files:/app/files
    networks:
      - smartprop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/api/sessions"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: smartprop-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx-logs:/var/log/nginx
      - letsencrypt-certs:/etc/letsencrypt:ro
    networks:
      - smartprop-network
    depends_on:
      - smartprop-app
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'



# Networks
networks:
  smartprop-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Volumes
volumes:
  app-storage:
    driver: local
  app-logs:
    driver: local
  waha-sessions:
    driver: local
  waha-files:
    driver: local
  nginx-logs:
    driver: local
  letsencrypt-certs:
    driver: local