# Production Docker Compose Configuration for SmartProp
# Only includes: WAHA (WhatsApp) and Flaresolverr (Cloudflare bypass)
# Note: smartprop-app runs via PM2, nginx runs via systemd

version: '3.8'

services:
  # WhatsApp Business API (WAHA)
  waha:
    image: devlikeapro/waha:arm-2025.9.8
    container_name: smartprop-waha
    restart: unless-stopped
    environment:
      - WAHA_DASHBOARD_ENABLED=true
      - WHATSAPP_HOOK_URL=${PUBLIC_BASE_URL}/api/wa/webhook
      - WHATSAPP_HOOK_EVENTS=message,message.any,state.change,group.join,presence.update
      - WAHA_SESSION_STORE_ENABLED=true
      - WAHA_SESSION_STORE_PATH=/app/sessions
      - WAHA_FILES_STORE_ENABLED=true
      - WAHA_FILES_STORE_PATH=/app/files
      - WAHA_LOG_LEVEL=info
      - WAHA_PRINT_QR=true
    ports:
      - "3030:3000"
    volumes:
      - waha-sessions:/app/sessions
      - waha-files:/app/files
    networks:
      - smartprop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/sessions"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # Flaresolverr - Cloudflare bypass (OPTIMIZED for t4g.medium - 4GB RAM)
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=Asia/Singapore
      - LANG=en_SG  # Match Singapore locale for better Cloudflare compatibility
      # Allow tougher challenges (request timeout). Default 60000; bump to 180000.
      - MAX_TIMEOUT=180000
      # Browser timeout: Maximum time for browser operations (default: 40000ms)
      # Increased to 200000ms (200s) to match maxTimeout for aggressive challenges
      - BROWSER_TIMEOUT=200000
    networks:
      - smartprop-network
    # Docker Compose ignores the deploy block unless running in Swarm mode.
    # Explicit resource limits are set here to actually take effect.
    shm_size: 2g          # Give Chromium enough /dev/shm to avoid tab crashes
    mem_limit: 2g         # Real memory cap (was effectively ~1G without this)
    cpus: "1.5"           # Allow more CPU when solving challenges
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8191/v1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

# Networks
networks:
  smartprop-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Volumes
volumes:
  waha-sessions:
    driver: local
  waha-files:
    driver: local
