# Optimized Docker Compose for t4g.small (2GB RAM)
# Memory limits set to prevent OOM kills while maximizing available resources

version: '3.8'

services:
  # Main Application
  smartprop-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: smartprop-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE=${SUPABASE_SERVICE_ROLE}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - WAHA_URL=http://waha:3030
      - GROQ_API_KEY=${GROQ_API_KEY}
      - WABA_TOKEN=${WABA_TOKEN}
      - WABA_PHONE_ID=${WABA_PHONE_ID}
    ports:
      - "3000:3000"
    volumes:
      - app-storage:/app/storage
      - app-logs:/app/logs
    networks:
      - smartprop-network
    depends_on:
      - waha
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 600M  # Reduced from 2G to fit t4g.small
          cpus: '0.8'
        reservations:
          memory: 300M  # Guaranteed minimum
          cpus: '0.4'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  # WhatsApp Business API (WAHA) - Optimized for low memory
  waha:
    image: devlikeapro/waha:arm-2025.9.8
    container_name: smartprop-waha
    restart: unless-stopped
    environment:
      - WAHA_DASHBOARD_ENABLED=true
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD:-admin}
      - WHATSAPP_HOOK_URL=${PUBLIC_BASE_URL}/api/wa/webhook
      - WHATSAPP_HOOK_EVENTS=message,message.any,state.change,group.join,presence.update
      - WAHA_SESSION_STORE_ENABLED=true
      - WAHA_SESSION_STORE_PATH=/app/sessions
      - WAHA_FILES_STORE_ENABLED=true
      - WAHA_FILES_STORE_PATH=/app/files
      - WAHA_LOG_LEVEL=info
      - WAHA_PRINT_QR=true
      # Chrome optimization flags for lower memory usage
      - WAHA_CHROME_ARGS=--disable-dev-shm-usage,--no-sandbox,--disable-gpu,--disable-software-rasterizer,--disable-extensions,--disable-plugins,--disable-default-apps,--disable-sync,--disable-translate,--hide-scrollbars,--mute-audio,--no-default-browser-check
    ports:
      - "3030:3030"
    volumes:
      - waha-sessions:/app/sessions
      - waha-files:/app/files
    networks:
      - smartprop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/api/sessions"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 600M  # Current usage: 222MB, allows 2.7x growth (safe buffer)
          cpus: '0.5'
        reservations:
          memory: 300M  # Guaranteed minimum for Chrome base
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  # Flaresolverr - Cloudflare bypass
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      - "8191:8191"
    environment:
      # Flaresolverr Configuration
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none  # Disable captcha solver (use default Cloudflare bypass)
      - TZ=Asia/Singapore
    networks:
      - smartprop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8191/v1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 500M  # Increased for stability
          cpus: '0.5'
        reservations:
          memory: 300M  # Guaranteed minimum
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: smartprop-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx-logs:/var/log/nginx
      - letsencrypt-certs:/etc/letsencrypt:ro
    networks:
      - smartprop-network
    depends_on:
      - smartprop-app
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 200M  # Nginx is lightweight
          cpus: '0.2'
        reservations:
          memory: 100M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# Networks
networks:
  smartprop-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Volumes
volumes:
  app-storage:
    driver: local
  app-logs:
    driver: local
  waha-sessions:
    driver: local
  waha-files:
    driver: local
  nginx-logs:
    driver: local
  letsencrypt-certs:
    driver: local

