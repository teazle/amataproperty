services:
  waha:
    # Apple Silicon build for WAHA 2025.9; swap to devlikeapro/waha:latest-2025.9.8 on x86
    image: devlikeapro/waha:arm-2025.9.8
    container_name: smartprop-waha
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      # WAHA Configuration (no API key required for this build)
      # Dashboard Configuration
      - WAHA_DASHBOARD_ENABLED=true
      - WAHA_DASHBOARD_USERNAME=admin
      - WAHA_DASHBOARD_PASSWORD=admin123

      # Webhook Configuration (Docker needs host.docker.internal to reach host machine)
      - WHATSAPP_HOOK_URL=http://host.docker.internal:3000/api/wa/webhook
      - WHATSAPP_HOOK_EVENTS=message,message.ack,session.status

      # Session Configuration
      - WAHA_DEFAULT_ENGINE=WEBJS

      # Log Level (debug, info, warn, error)
      - WAHA_LOG_LEVEL=info

    volumes:
      # Persist WhatsApp session data
      - waha-sessions:/app/.wwebjs_auth
      - waha-files:/app/.wwebjs_cache

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/sessions"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Flaresolverr - Cloudflare bypass for scrapers
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
      - TZ=Asia/Singapore
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "-X", "POST", "-H", "Content-Type: application/json", "-d", "{\"cmd\":\"sessions.list\"}", "http://localhost:8191/v1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  waha-sessions:
    name: smartprop-waha-sessions
  waha-files:
    name: smartprop-waha-files

# Usage Instructions:
#
# 1. Start WAHA:
#    docker compose up -d
#
# 2. View logs:
#    docker compose logs -f waha
#
# 3. Stop WAHA:
#    docker compose down
#
# 4. Check status:
#    docker compose ps
#
# 5. Scan QR Code:
#    - Visit http://localhost:3030
#    - Create a session named "default"
#    - Scan QR code with WhatsApp on your phone
#
# 6. Set webhook URL in production:
#    Update PUBLIC_BASE_URL in .env.local to your domain:
#    PUBLIC_BASE_URL=https://yourdomain.com
