# Nginx configuration for SmartProp on EC2
# Main application on port 3000, WAHA on port 3030

upstream smartprop_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream waha_app {
    server 127.0.0.1:3030;
    keepalive 64;
}

# HTTP server - redirect to HTTPS (optional, can be enabled later)
server {
    listen 80;
    server_name 18.142.253.142;

    # For Let's Encrypt certificate validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other traffic to HTTPS (uncomment when SSL is set up)
    # return 301 https://$server_name$request_uri;

    # For now, proxy to HTTP
    location / {
        proxy_pass http://smartprop_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # WAHA dashboard and API
    location /waha/ {
        proxy_pass http://waha_app/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # WebSocket support for WAHA
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

