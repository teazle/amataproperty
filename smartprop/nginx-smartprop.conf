# Nginx configuration for SmartProp on EC2
# Main application on port 3000, WAHA on port 3030

upstream smartprop_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream waha_app {
    server 127.0.0.1:3030;
    keepalive 64;
}

# HTTP server - redirect to HTTPS (optional, can be enabled later)
# Using "_" as server_name accepts any IP address/hostname (IP-agnostic)
server {
    listen 80;
    server_name _;

    # For Let's Encrypt certificate validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other traffic to HTTPS (uncomment when SSL is set up)
    # return 301 https://$server_name$request_uri;

    # Admin UI is private in production through the app password gate.
    location ^~ /admin {
        proxy_pass http://smartprop_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Operational APIs expose data or trigger automation. Keep public health,
    # WhatsApp webhook, and external signing routes outside this regex; app
    # middleware enforces the admin session cookie on these routes.
    location ~ ^/api/(admin|agents|articles|conversations|jobs|linkedin|listings|outreach|scheduler|scraper|services|viewings|wa/send)(/|$) {
        proxy_pass http://smartprop_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # WAHA posts webhooks from the Docker bridge network. Keep this endpoint
    # unavailable to the public internet so forged inbound messages cannot
    # trigger AI replies or conversation state changes.
    location = /api/wa/webhook {
        allow 172.20.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://smartprop_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Drop common internet-wide probes before they reach Next.js.
    location ~ /\.(?!well-known/acme-challenge/) {
        return 404;
    }

    # The public homepage is read-only. This blocks generic RSC/server-action
    # exploit probes that POST to "/" while preserving /api/* POST endpoints.
    location = / {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        proxy_pass http://smartprop_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # For now, proxy to HTTP
    location / {
        proxy_pass http://smartprop_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # WAHA dashboard and API
    location /waha/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://waha_app/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # WebSocket support for WAHA
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

